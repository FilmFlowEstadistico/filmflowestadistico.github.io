<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estadístico FilmFlow</title>
<meta name="theme-color" content="#171918" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E9E9EC" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FilmFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<link rel="icon" href="assets/icono-192.png">
<link rel="stylesheet" href="paleta.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="progreso" aria-hidden="true"><i></i></div>
<header class="barra" id="barra">
  <img id="logo" src="assets/logo_filmflow_oscuro.png" alt="FilmFlow">
  <button class="proyecto-btn" id="btn-proyecto" aria-haspopup="dialog" aria-label="Cambiar de proyecto">
    <span class="p-etq">Proyecto</span><span class="p-nom" id="proyecto-nombre">—</span>
    <svg viewBox="0 0 24 24" class="p-flecha"><path d="M7 10l5 5 5-5"/></svg>
  </button>
  <button class="icono-btn" id="btn-actualizar" aria-label="Actualizar" data-a="actualizar" data-p="{&quot;forzar&quot;:true}">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
  </button>
  <button class="icono-btn" id="btn-app" aria-label="Ajustes de la app" data-ir="app">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5h0a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<div class="franja" id="franja" hidden></div>
<main id="vista"></main>
<div id="accion-fija" hidden></div>
<nav class="tabs" id="tabs" aria-label="Secciones">
  <button data-ir="resumen"><svg viewBox="0 0 24 24"><rect x="3.5" y="12" width="4" height="8" rx="1"/><rect x="10" y="6" width="4" height="14" rx="1"/><rect x="16.5" y="3" width="4" height="17" rx="1"/></svg><span>Resumen</span></button>
  <button data-ir="registrar"><svg viewBox="0 0 24 24"><path d="M6 3.5h9l4 4V20a.5.5 0 0 1-.5.5h-12A.5.5 0 0 1 6 20z"/><path d="M14.5 3.5V8H19M9 13h6M9 16.5h4"/></svg><span>Registrar</span></button>
  <button data-ir="hojas"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M3.5 15h17M9.5 4v16"/></svg><span>Hojas</span></button>
  <button data-ir="correo"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg><span>Correo</span></button>
  <button data-ir="ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg><span>Ajustes</span></button>
</nav>
<div id="ocupado"><div><div class="giro"></div><span id="ocupado-txt">Un momento…</span></div></div>
<div class="sheet-fondo" id="modal">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="agarre"></div>
    <h3 id="m-titulo"></h3><pre id="m-texto"></pre><div id="m-lista" class="lista-sheet"></div>
    <input id="m-input" style="display:none" autocapitalize="sentences">
    <div class="sheet-botones"><button class="btn acento" id="m-si">Aceptar</button><button class="btn" id="m-no">Cancelar</button></div>
  </div>
</div>
<div id="portada" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="selector-pdf" accept="application/pdf,.pdf" style="display:none">
<script src="version.js"></script>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
